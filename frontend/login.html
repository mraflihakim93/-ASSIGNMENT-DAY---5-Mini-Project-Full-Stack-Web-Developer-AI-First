<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Hello World To-Do List</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/config.js"></script>
    <script src="js/auth.js" defer></script>
  </head>
  <body class="auth-body">
    <header class="site-header">
      <div class="site-header__inner">
        <p class="site-header__logo">&lt;<span>HelloWorld</span> To-Do List /&gt;</p>
        <a class="nav-link" href="index.html">&larr; Beranda</a>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <h1 class="auth-title">Masuk</h1>
        <p class="auth-subtitle">Login untuk melanjutkan ke dashboard Anda.</p>

        <div id="auth-message" class="auth-message" hidden></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" name="email" placeholder="nama@email.com" required autocomplete="email" />
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-with-toggle">
              <input id="login-password" type="password" name="password" placeholder="Password Anda" required autocomplete="current-password" />
              <button type="button" class="toggle-password" data-toggle-password="login-password">Lihat</button>
            </div>
          </div>

          <button id="btn-login" type="submit" class="btn-primary">Masuk</button>
        </form>

        <p class="auth-switch">
          Belum punya akun? <a href="register.html">Daftar di sini</a>
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>&copy; 2026 Hello World To-Do List. Mini Project Fullstack Web Development.</p>
      </div>
    </footer>
  </body>
</html>
